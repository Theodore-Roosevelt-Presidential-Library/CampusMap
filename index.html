<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TRPL Campus — 3D Model Viewer</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
<style>
  /* TRPL brand fonts (self-hosted on trlibrary.com) */
  @font-face{font-family:'Dharma Gothic E';src:url('https://www.trlibrary.com/themes/custom/trpl/css/dharma_type-dharmagothice-exbold.woff2') format('woff2');font-weight:800;font-style:normal;font-display:swap;}
  @font-face{font-family:'Dharma Gothic E';src:url('https://www.trlibrary.com/themes/custom/trpl/css/dharma_type-dharmagothice-bold.woff2') format('woff2');font-weight:700;font-style:normal;font-display:swap;}
  @font-face{font-family:'Clearface';src:url('https://www.trlibrary.com/themes/custom/trpl/css/clearfacestd-regular.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap;}
  @font-face{font-family:'Clearface';src:url('https://www.trlibrary.com/themes/custom/trpl/css/clearfacestd-regularitalic.woff2') format('woff2');font-weight:400;font-style:italic;font-display:swap;}
  @font-face{font-family:'Clearface';src:url('https://www.trlibrary.com/themes/custom/trpl/css/clearfacestd-bold.woff2') format('woff2');font-weight:500;font-style:normal;font-display:swap;}
  @font-face{font-family:'Clearface';src:url('https://www.trlibrary.com/themes/custom/trpl/css/clearfacestd-heavy.woff2') format('woff2');font-weight:700;font-style:normal;font-display:swap;}
  @font-face{font-family:'Frutiger';src:url('https://www.trlibrary.com/themes/custom/trpl/css/frutigerltstd-light.woff2') format('woff2');font-weight:300;font-style:normal;font-display:swap;}
  @font-face{font-family:'Frutiger';src:url('https://www.trlibrary.com/themes/custom/trpl/css/frutigerltstd-regular.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap;}
  @font-face{font-family:'Frutiger';src:url('https://www.trlibrary.com/themes/custom/trpl/css/frutigerltstd-bold.woff2') format('woff2');font-weight:700;font-style:normal;font-display:swap;}

  :root {
    --accent:#e7805d;      /* Deep Orange — brand action color */
    --accent-dark:#d07556; /* Deep Orange (dark) — secondary button border */
    --marker:#25282a;      /* Dark Gray — subdued POI markers */
    --text:#25282a;        /* Dark Gray */
    --line:#d8d5cf;
    --font-display:'Dharma Gothic E',Impact,'Arial Narrow',sans-serif;
    --font-body:'Clearface',Georgia,'Times New Roman',serif;
    --font-ui:'Frutiger',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:#ffffff; color:var(--text); font-family:var(--font-ui); }
  .stage { position:relative; width:100%; height:100%; }
  model-viewer { width:100%; height:100%; background:#ffffff; --poster-color:#ffffff; cursor:crosshair;
    --min-hotspot-opacity:1; }   /* disable model-viewer's facing dim; occlusion handled by heightfield */
  model-viewer.dragging { cursor:grabbing; }

  /* zoom controls, lower right */
  .zoom { position:absolute; right:20px; bottom:20px; display:flex; flex-direction:column; gap:8px; }
  .zoom button { width:44px; height:44px; border-radius:2px; border:1px solid var(--line);
    background:rgba(255,255,255,.94); color:var(--text); font-size:22px; line-height:1; cursor:pointer;
    box-shadow:0 1px 3px rgba(0,0,0,.08); display:flex; align-items:center; justify-content:center; }
  .zoom button:hover { border-color:var(--accent); color:var(--accent); }
  .zoom button:active { background:#f1eee8; }
  .zoom button svg { width:20px; height:20px; }
  .zoom #poiToggle { margin-bottom:6px; color:var(--marker); }       /* on-state: subdued dark pin */
  .zoom #poiToggle.off { color:#a7abb0; }                            /* hidden-state: muted */
  .stage.poi-hidden .poi { display:none; }

  /* logo, lower left */
  .logo { position:absolute; left:20px; bottom:20px; }
  .logo img { height:40px; width:auto; display:block; opacity:.95; }
  .logo a:hover img { opacity:1; }

  /* controls guide, lower center */
  .guide { position:absolute; left:50%; bottom:20px; transform:translateX(-50%);
    display:flex; flex-wrap:wrap; justify-content:center; gap:20px; align-items:center; padding:9px 18px;
    max-width:calc(100vw - 32px);
    background:rgba(255,255,255,.9); border:1px solid var(--line); border-radius:4px;
    box-shadow:0 1px 4px rgba(0,0,0,.08); font-size:12px; color:#54585d; user-select:none; }
  .guide .item { display:flex; align-items:center; gap:7px; white-space:nowrap; }
  .guide svg { width:18px; height:18px; stroke:#8a8f95; fill:none; stroke-width:1.6;
    stroke-linecap:round; stroke-linejoin:round; }
  .guide b { font-family:var(--font-ui); font-weight:700; color:var(--text); }
  @media (max-width: 720px){
    .guide{ gap:12px 14px; padding:7px 12px; font-size:11px; bottom:14px; }
    .guide svg{ width:16px; height:16px; }
    .logo img{ height:32px; }
  }
  @media (max-width: 430px){
    .guide{ gap:8px 12px; font-size:10px; }
  }

  /* POI markers (model-viewer hotspots) */
  .poi { width:14px; height:14px; border-radius:50%; padding:0; cursor:pointer;
    background:var(--marker); border:2px solid #fff; box-shadow:0 1px 3px rgba(0,0,0,.3);
    transition:transform .12s ease, opacity .15s ease; }
  .poi::after { content:''; position:absolute; inset:-5px; border-radius:50%;
    border:1px solid var(--marker); opacity:.28; pointer-events:none; }
  .poi:hover, .poi.active { transform:scale(1.28); }
  .poi .lbl { position:absolute; bottom:calc(100% + 9px); left:50%; transform:translateX(-50%);
    background:#2a2d31; color:#fff; font-size:11px; white-space:nowrap; padding:3px 8px;
    border-radius:6px; opacity:0; pointer-events:none; transition:opacity .12s; }
  .poi:hover .lbl { opacity:1; }
  .poi.occluded { opacity:0; pointer-events:none; }   /* hidden when a building/berm blocks the view */

  /* info panel, slides in from the right */
  .panel { position:absolute; top:0; right:0; height:100%; width:360px; max-width:86vw; z-index:5;
    background:#fff; border-left:1px solid var(--line); box-shadow:-6px 0 26px rgba(0,0,0,.12);
    transform:translateX(100%); transition:transform .28s cubic-bezier(.4,0,.2,1);
    display:flex; flex-direction:column; overflow:hidden; }
  .panel.open { transform:translateX(0); }
  .panel .close { position:absolute; top:12px; right:12px; width:32px; height:32px; z-index:2;
    border-radius:2px; border:1px solid var(--line); background:rgba(255,255,255,.9);
    cursor:pointer; font-size:18px; line-height:1; color:var(--text); }
  .panel .pimg { width:100%; height:210px; object-fit:cover; background:#ece9e3; display:block; }
  .panel .pbody { padding:24px; overflow:auto; }
  .panel .ptitle { font-family:var(--font-display); font-weight:800; text-transform:uppercase;
    letter-spacing:.015em; font-size:27px; line-height:1.04; margin:0 0 12px; }
  .panel .pdesc { font-family:var(--font-body); font-size:16px; line-height:1.5; color:#41454a; margin:0 0 20px; }
  /* secondary (outline) button — matches trlibrary.com: 2px radius, Frutiger 700, Deep Orange */
  .panel .pcta { font-family:var(--font-ui); font-weight:700; font-size:16px; letter-spacing:normal;
    text-transform:none; display:inline-block; background:transparent; color:var(--text);
    border:1px solid var(--accent-dark); text-decoration:none; padding:10px 24px; border-radius:2px;
    transition:background .12s ease, color .12s ease; }
  .panel .pcta:hover { background:var(--accent-dark); color:#25282a; }
  @media (max-width:480px){ .panel{ width:100%; max-width:100%; } }

  /* coordinate picker (edit mode only) */
  .picker { position:absolute; left:50%; top:16px; transform:translateX(-50%); z-index:6; display:none;
    background:#2a2d31; color:#fff; font:12px ui-monospace,Menlo,monospace; padding:10px 14px;
    border-radius:10px; max-width:90vw; box-shadow:0 4px 16px rgba(0,0,0,.3); }
  .picker.show { display:block; }
  .picker button { font:inherit; margin-top:8px; cursor:pointer; border:1px solid #555;
    background:#3a3f45; color:#fff; border-radius:6px; padding:4px 10px; }

  /* embed button + dialog */
  .embed-btn { position:absolute; top:20px; left:20px; z-index:6; display:flex; align-items:center; justify-content:center;
    width:44px; height:44px; background:rgba(255,255,255,.94); border:1px solid var(--line); border-radius:2px;
    color:var(--text); cursor:pointer; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .embed-btn:hover { border-color:var(--accent); }
  .embed-btn svg { width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .embed-modal { position:absolute; inset:0; z-index:20; background:rgba(0,0,0,.35); display:none; align-items:center; justify-content:center; }
  .embed-modal.open { display:flex; }
  .embed-card { background:#fff; border-radius:4px; width:min(560px,92vw); max-height:88vh; overflow:auto;
    padding:24px 24px 26px; box-shadow:0 14px 44px rgba(0,0,0,.28); position:relative; }
  .embed-card h2 { font-family:var(--font-display); font-weight:800; text-transform:uppercase; letter-spacing:.02em; font-size:22px; margin:0 0 4px; }
  .embed-card p { font-family:var(--font-body); font-size:15px; line-height:1.5; color:#41454a; margin:0 0 8px; }
  .embed-card label { font-family:var(--font-ui); font-weight:700; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:#6b7075; display:block; margin:16px 0 6px; }
  .embed-card textarea { width:100%; height:64px; font:12px/1.4 ui-monospace,Menlo,monospace; border:1px solid var(--line);
    border-radius:2px; padding:9px; resize:vertical; color:var(--text); background:#faf9f6; }
  .embed-card .copy { margin-top:8px; font-family:var(--font-ui); font-weight:700; font-size:12px; border:1px solid var(--accent-dark);
    background:transparent; color:var(--text); border-radius:2px; padding:7px 14px; cursor:pointer; transition:background .12s; }
  .embed-card .copy:hover { background:var(--accent-dark); }
  .embed-card .x { position:absolute; top:14px; right:14px; width:30px; height:30px; border:1px solid var(--line);
    background:#fff; border-radius:2px; cursor:pointer; font-size:17px; color:var(--text); }

  /* loading */
  .loading { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:14px; pointer-events:none; }
  .loading .track { width:240px; height:6px; background:#eae7e1; border-radius:3px; overflow:hidden; }
  .loading .fill { height:100%; width:0%; background:var(--accent); transition:width .15s; }
  .loading span { font-size:13px; color:#6b7075; }
</style>
</head>
<body>
<div class="stage">
  <model-viewer
      id="mv"
      src="TRPL_campus_web.glb"
      alt="3D model of the TRPL campus"
      camera-controls
      disable-tap
      touch-action="none"
      interaction-prompt="none"
      shadow-intensity="0.6"
      shadow-softness="1"
      exposure="1.0"
      tone-mapping="neutral"
      environment-image="neutral"
      camera-orbit="-56deg 74deg 47.5m"
      camera-target="-39.3m 1.1m -64.2m"
      field-of-view="30deg"
      interpolation-decay="180"
      min-field-of-view="30deg"
      max-field-of-view="30deg"
      min-camera-orbit="auto 6deg 12m"
      max-camera-orbit="auto 88deg 500m">
    <div class="loading" slot="progress-bar">
      <div class="track"><div class="fill" id="fill"></div></div>
      <span id="ploss">Loading campus model…</span>
    </div>
  </model-viewer>

  <div class="zoom">
    <button id="fs" title="Full screen" aria-label="Toggle full screen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
    <button id="poiToggle" title="Hide points of interest" aria-label="Toggle points of interest">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6-5.2-6-10a6 6 0 1 1 12 0c0 4.8-6 10-6 10z"/><circle cx="12" cy="11" r="2"/></svg>
    </button>
    <button id="zin" title="Zoom in" aria-label="Zoom in">+</button>
    <button id="zout" title="Zoom out" aria-label="Zoom out">−</button>
  </div>

  <div class="logo">
    <a href="https://www.trlibrary.com" target="_blank" rel="noopener">
      <img src="img/TRPL_Wordmark_Black_RGB.svg" alt="Theodore Roosevelt Presidential Library" />
    </a>
  </div>

  <div class="guide" id="guide"></div>

  <aside class="panel" id="panel" aria-hidden="true">
    <button class="close" id="panelClose" aria-label="Close">×</button>
    <img class="pimg" id="pImg" alt="" />
    <div class="pbody">
      <h2 class="ptitle" id="pTitle"></h2>
      <p class="pdesc" id="pDesc"></p>
      <a class="pcta" id="pCta" target="_blank" rel="noopener"></a>
    </div>
  </aside>

  <div class="picker" id="picker"></div>

  <button class="embed-btn" id="embedBtn" title="Get embed code" aria-label="Get embed code">
    <svg viewBox="0 0 24 24"><path d="M8 9l-4 3 4 3M16 9l4 3-4 3M13 6l-2 12"/></svg>
  </button>

  <div class="embed-modal" id="embedModal">
    <div class="embed-card">
      <button class="x" id="embedClose" aria-label="Close">×</button>
      <h2>Embed this view</h2>
      <p>Paste this into a web page. The current camera angle, zoom, and open point of interest are carried in the link, so it opens exactly where you are now.</p>
      <label>JavaScript embed</label>
      <textarea id="embedJs" readonly></textarea>
      <button class="copy" data-target="embedJs">Copy script</button>
    </div>
  </div>
</div>

<script>
  const mv = document.getElementById('mv');
  const fill = document.getElementById('fill');
  const ploss = document.getElementById('ploss');

  // Starting view. Radius adapts to viewport aspect so the campus stays framed on narrow screens.
  const START_THETA = "-56deg", START_PHI = "74deg";
  const START_TARGET = "-39.3m 1.1m -64.2m";
  const BASE_RADIUS = 47.5;    // ideal distance you picked
  const REF_ASPECT  = 1.891;   // at the viewport aspect where you picked it
  const START_FOV   = "30deg"; // fixed FOV so distance alone controls apparent zoom
  const MIN_R = 12, MAX_R = 500;

  function startRadius(){
    const a = (mv.clientWidth || window.innerWidth) / (mv.clientHeight || window.innerHeight);
    return (BASE_RADIUS * Math.max(1, REF_ASPECT / a)).toFixed(1);
  }
  function applyStartView(){
    mv.cameraTarget = START_TARGET;
    mv.cameraOrbit = `${START_THETA} ${START_PHI} ${startRadius()}m`;
    mv.fieldOfView = START_FOV;
  }

  // ----- shareable URL state (compact permalink) -----
  let POIS = [];
  let currentPOI = null;
  const params = new URLSearchParams(location.search);
  const EDIT = params.has('edit');

  // Pack [theta, phi, radius, tx, ty, tz, poiIndex] as quantized base36, '-' delimited.
  function encodeState(o, t, poiIdx){
    let th = o.theta * 180 / Math.PI; th = ((th % 360) + 540) % 360 - 180;   // normalize to -180..180
    const q = [
      Math.round(th * 10) + 1800,
      Math.round(o.phi * 180 / Math.PI * 10),
      Math.round(o.radius * 10),
      Math.round((t.x + 250) * 10),
      Math.round((t.y + 50) * 10),
      Math.round((t.z + 250) * 10),
      poiIdx || 0
    ];
    return q.map(n => Math.max(0, n).toString(36)).join('-');
  }
  function decodeState(s){
    const a = (s || '').split('-').map(x => parseInt(x, 36));
    if (a.length < 7 || a.some(n => Number.isNaN(n))) return null;
    return { theta:(a[0]-1800)/10, phi:a[1]/10, radius:a[2]/10,
             tx:a[3]/10-250, ty:a[4]/10-50, tz:a[5]/10-250, poi:a[6] };
  }
  const initial = params.has('v') ? decodeState(params.get('v')) : null;

  let urlTimer;
  function updateURL(){
    const o = mv.getCameraOrbit(), t = mv.getCameraTarget();
    const idx = currentPOI ? (POIS.findIndex(p => p.id === currentPOI.id) + 1) : 0;
    const p = new URLSearchParams();
    p.set('v', encodeState(o, t, idx));
    if (EDIT) p.set('edit', '');
    history.replaceState(null, '', location.pathname + '?' + p.toString());
  }
  function scheduleURL(){ clearTimeout(urlTimer); urlTimer = setTimeout(updateURL, 300); }
  function applyDecoded(d){
    mv.cameraTarget = `${d.tx}m ${d.ty}m ${d.tz}m`;
    mv.cameraOrbit  = `${d.theta}deg ${d.phi}deg ${d.radius}m`;
    mv.fieldOfView  = START_FOV;
  }

  let userMoved = !!initial;   // a permalink counts as "user-set" so auto-framing won't override it
  try { new ResizeObserver(() => { if (!userMoved) applyStartView(); }).observe(mv); } catch(_){}
  window.addEventListener('resize', () => { if (!userMoved) applyStartView(); });

  function hideLoader(){ const l=document.querySelector('.loading'); if(l) l.style.display='none'; }
  mv.addEventListener('progress', (e) => {
    const p = Math.round(e.detail.totalProgress * 100);
    fill.style.width = p + '%';
    ploss.textContent = `Loading campus model… ${p}%`;
    if (e.detail.totalProgress >= 1) hideLoader();
  });
  mv.addEventListener('load', () => {
    hideLoader();
    // Apply then snap; re-apply after model-viewer commits its attribute-driven default camera.
    const apply = () => { if (initial) applyDecoded(initial); else applyStartView(); mv.jumpCameraToGoal(); };
    apply();
    requestAnimationFrame(() => requestAnimationFrame(apply));
    setTimeout(apply, 220);
  });
  mv.addEventListener('camera-change', scheduleURL);

  // Manual zoom buttons (dolly by changing orbit radius; FOV stays fixed).
  function zoomBy(factor){
    const o = mv.getCameraOrbit();
    const r = Math.max(MIN_R, Math.min(MAX_R, o.radius * factor));
    mv.cameraOrbit = `${(o.theta*180/Math.PI).toFixed(2)}deg ${(o.phi*180/Math.PI).toFixed(2)}deg ${r.toFixed(1)}m`;
    userMoved = true;
  }
  document.getElementById('zin').onclick  = () => zoomBy(0.85);
  document.getElementById('zout').onclick = () => zoomBy(1.0/0.85);

  // Any deliberate camera control stops the auto-reframe on resize.
  mv.addEventListener('wheel', () => { userMoved = true; });

  // Show a grabbing cursor while dragging to orbit.
  mv.addEventListener('pointerdown', () => { userMoved = true; mv.classList.add('dragging'); });
  const endDrag = () => mv.classList.remove('dragging');
  mv.addEventListener('pointerup', endDrag);
  mv.addEventListener('pointercancel', endDrag);

  // Recenter the orbit pivot on a screen point (used by double-click and double-tap).
  function recenterAt(x, y){
    const hit = mv.positionAndNormalFromPoint(x, y);
    if (hit && hit.position) { mv.cameraTarget = hit.position.toString(); userMoved = true; }
  }
  // Mouse: double-click to recenter.
  mv.addEventListener('dblclick', (e) => recenterAt(e.clientX, e.clientY));
  // Touch: double-tap to recenter (dblclick is unreliable on touch devices).
  let lastTap = 0, lastXY = null;
  mv.addEventListener('touchend', (e) => {
    if (e.changedTouches.length !== 1) { lastTap = 0; lastXY = null; return; }
    const t = e.changedTouches[0], now = Date.now();
    if (now - lastTap < 320 && lastXY && Math.hypot(t.clientX - lastXY.x, t.clientY - lastXY.y) < 30) {
      recenterAt(t.clientX, t.clientY); lastTap = 0; lastXY = null;
    } else { lastTap = now; lastXY = { x: t.clientX, y: t.clientY }; }
  });

  // Build the controls guide with device-appropriate instructions.
  const isTouch = matchMedia('(pointer: coarse)').matches || ('ontouchstart' in window);
  const ICON = {
    rotate:'<svg viewBox="0 0 24 24"><path d="M20.5 12a8.5 8.5 0 1 1-2.4-5.9"/><path d="M20.5 4.5V9h-4.5"/></svg>',
    zoom:'<svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><line x1="15" y1="15" x2="20" y2="20"/><line x1="7.8" y1="10.5" x2="13.2" y2="10.5"/><line x1="10.5" y1="7.8" x2="10.5" y2="13.2"/></svg>',
    pan:'<svg viewBox="0 0 24 24"><line x1="12" y1="3" x2="12" y2="21"/><line x1="3" y1="12" x2="21" y2="12"/><path d="M12 3l-2.3 2.6M12 3l2.3 2.6M12 21l-2.3-2.6M12 21l2.3-2.6M3 12l2.6-2.3M3 12l2.6 2.3M21 12l-2.6-2.3M21 12l-2.6 2.3"/></svg>',
    target:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><line x1="12" y1="1.5" x2="12" y2="5.5"/><line x1="12" y1="18.5" x2="12" y2="22.5"/><line x1="1.5" y1="12" x2="5.5" y2="12"/><line x1="18.5" y1="12" x2="22.5" y2="12"/><circle cx="12" cy="12" r="1.6" fill="#8a8f95" stroke="none"/></svg>',
  };
  const guideItems = isTouch ? [
    ['rotate','One finger','rotate'],
    ['zoom','Pinch','zoom'],
    ['pan','Two fingers','pan'],
    ['target','Double-tap','recenter'],
  ] : [
    ['rotate','Drag','rotate'],
    ['zoom','Scroll','zoom'],
    ['pan','Right-drag','pan'],
    ['target','Double-click','recenter'],
  ];
  document.getElementById('guide').innerHTML = guideItems
    .map(([ic,a,d]) => `<div class="item">${ICON[ic]}<span><b>${a}</b> ${d}</span></div>`).join('');

  // ---------- Points of interest ----------
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  function renderPOIs(pois){
    mv.querySelectorAll('[slot^="hotspot-poi-"]').forEach(n => n.remove());
    pois.forEach(p => {
      if (!p.position) return;
      const btn = document.createElement('button');
      btn.slot = 'hotspot-poi-' + p.id;
      btn.className = 'poi';
      btn.dataset.position = p.position;
      if (p.normal) btn.dataset.normal = p.normal;
      btn.innerHTML = `<span class="lbl">${esc(p.title)}</span>`;
      btn.addEventListener('click', (e) => { e.stopPropagation(); openPanel(p, btn); });
      mv.appendChild(btn);
    });
  }

  const panel = document.getElementById('panel');
  const pImg = document.getElementById('pImg'), pTitle = document.getElementById('pTitle');
  const pDesc = document.getElementById('pDesc'), pCta = document.getElementById('pCta');
  function clearActive(){ mv.querySelectorAll('.poi.active').forEach(n => n.classList.remove('active')); }
  function openPanel(p, btn){
    clearActive(); if (btn) btn.classList.add('active');
    if (p.image){ pImg.src = p.image; pImg.style.display = 'block'; pImg.onerror = () => { pImg.style.display = 'none'; }; }
    else { pImg.removeAttribute('src'); pImg.style.display = 'none'; }
    pTitle.textContent = p.title || '';
    pDesc.textContent = p.description || '';
    if (p.cta && p.cta.url){ pCta.textContent = p.cta.label || 'Learn more'; pCta.href = p.cta.url; pCta.style.display = 'inline-block'; }
    else { pCta.style.display = 'none'; }
    panel.classList.add('open'); panel.setAttribute('aria-hidden', 'false');
    currentPOI = p; updateURL();
  }
  function closePanel(){ panel.classList.remove('open'); panel.setAttribute('aria-hidden', 'true'); clearActive();
    if (currentPOI){ currentPOI = null; updateURL(); } }
  document.getElementById('panelClose').onclick = closePanel;
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePanel(); });

  // Toggle POI markers on/off for a clean view.
  const stage = document.querySelector('.stage');
  const poiToggle = document.getElementById('poiToggle');
  poiToggle.onclick = () => {
    const hidden = stage.classList.toggle('poi-hidden');
    poiToggle.classList.toggle('off', hidden);
    poiToggle.title = hidden ? 'Show points of interest' : 'Hide points of interest';
    if (hidden) closePanel();
  };

  // Fast occlusion via a precomputed terrain/building height map (ray-march, no GPU raycasting).
  let HF = null;
  fetch('heightfield.json', { cache: 'force-cache' })
    .then(r => r.ok ? r.json() : null)
    .then(d => { HF = d; updateOcclusion(); })
    .catch(() => {});
  function hAt(x, z){
    if (!HF) return -9999;
    const i = Math.round((x - HF.x0) / HF.step), j = Math.round((z - HF.z0) / HF.step);
    if (i < 0 || i >= HF.nx || j < 0 || j >= HF.nz) return -9999;
    return HF.h[j * HF.nx + i];
  }
  function updateOcclusion(){
    if (!HF) return;
    const o = mv.getCameraOrbit(), t = mv.getCameraTarget();
    const sp = Math.sin(o.phi), cp = Math.cos(o.phi), st = Math.sin(o.theta), ct = Math.cos(o.theta);
    const cam = { x:t.x + o.radius*sp*st, y:t.y + o.radius*cp, z:t.z + o.radius*sp*ct };
    mv.querySelectorAll('.poi').forEach(b => {
      const p = b.dataset.position.split(/\s+/).map(Number);
      const dx = cam.x-p[0], dy = cam.y-p[1], dz = cam.z-p[2];
      const len = Math.hypot(dx, dy, dz) || 1;
      const ux = dx/len, uy = dy/len, uz = dz/len;
      let occ = false;
      for (let d = 1.3; d < len - 2; d += 0.8) {          // skip the surface the marker sits on
        const h = hAt(p[0] + ux*d, p[2] + uz*d);
        if (h > -9000 && h > p[1] + uy*d + 0.4) { occ = true; break; }   // ground/building rises above the sightline
      }
      b.classList.toggle('occluded', occ);
    });
  }
  let occRAF = 0;
  function scheduleOcclusion(){ if (occRAF) return; occRAF = requestAnimationFrame(() => { occRAF = 0; updateOcclusion(); }); }
  mv.addEventListener('camera-change', scheduleOcclusion);

  fetch('pois.json', { cache: 'no-cache' })
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(d => {
      POIS = d.pois || [];
      renderPOIs(POIS);
      if (initial && initial.poi > 0 && POIS[initial.poi - 1]) {
        const p = POIS[initial.poi - 1];
        openPanel(p, mv.querySelector('[slot="hotspot-poi-' + p.id + '"]'));
      }
      requestAnimationFrame(() => requestAnimationFrame(updateOcclusion));
    })
    .catch(() => { /* no pois.json yet — viewer still works */ });

  // ---------- Coordinate picker (authoring tool: add ?edit to the URL) ----------
  const picker = document.getElementById('picker');
  mv.addEventListener('contextmenu', (e) => {
    e.preventDefault();                 // suppress the browser menu on right-click everywhere
    if (!EDIT) return;
    const hit = mv.positionAndNormalFromPoint(e.clientX, e.clientY);
    if (!hit || !hit.position){ picker.classList.add('show'); picker.textContent = 'No model surface here — right-click on the model.'; return; }
    const fmt = (v, d) => v.toString().replace(/m/g, '').trim().split(/\s+/).map(n => (+n).toFixed(d)).join(' ');
    const pos = fmt(hit.position, 2);
    const nrm = hit.normal ? fmt(hit.normal, 3) : '0 1 0';
    const snippet =
`{
  "id": "new-poi",
  "title": "New POI",
  "image": "img/poi/new-poi.jpg",
  "description": "",
  "cta": null,
  "position": "${pos}",
  "normal": "${nrm}"
}`;
    picker.innerHTML = `<div>position: ${pos}<br>normal: ${nrm}</div><button id="copySnip">Copy POI JSON</button>`;
    picker.classList.add('show');
    document.getElementById('copySnip').onclick = () => {
      if (navigator.clipboard) navigator.clipboard.writeText(snippet);
      const b = document.getElementById('copySnip'); b.textContent = 'Copied ✓'; setTimeout(() => b.textContent = 'Copy POI JSON', 1200);
    };
  });

  // ---------- Full screen ----------
  const fsBtn = document.getElementById('fs');
  fsBtn.onclick = () => {
    if (document.fullscreenElement) { document.exitFullscreen(); }
    else if (stage.requestFullscreen) { stage.requestFullscreen(); }
    else if (stage.webkitRequestFullscreen) { stage.webkitRequestFullscreen(); }
  };
  document.addEventListener('fullscreenchange', () => {
    const on = !!document.fullscreenElement;
    fsBtn.querySelector('svg').innerHTML = on
      ? '<path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/>'
      : '<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>';
  });

  // ---------- Embed dialog ----------
  const embedModal = document.getElementById('embedModal');
  function openEmbed(){
    updateURL();                                   // sync the URL to the current view first
    const v = new URLSearchParams(location.search).get('v') || '';
    document.getElementById('embedJs').value =
      `<script src="${location.origin}/embed.js" data-view="${v}" data-height="600"><\/script>`;
    embedModal.classList.add('open');
  }
  document.getElementById('embedBtn').onclick = openEmbed;
  document.getElementById('embedClose').onclick = () => embedModal.classList.remove('open');
  embedModal.addEventListener('click', (e) => { if (e.target === embedModal) embedModal.classList.remove('open'); });
  document.querySelectorAll('.embed-card .copy').forEach(btn => {
    btn.onclick = () => {
      const ta = document.getElementById(btn.dataset.target);
      ta.select(); if (navigator.clipboard) navigator.clipboard.writeText(ta.value);
      const o = btn.textContent; btn.textContent = 'Copied ✓'; setTimeout(() => btn.textContent = o, 1200);
    };
  });
</script>
</body>
</html>
